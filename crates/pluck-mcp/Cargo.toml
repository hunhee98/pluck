[package]
name = "pluck-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "MCP server (pluckd) for pluck — exposes the read/search/grep/symbol/peek/expand tools over stdio for AI coding agents like Claude Code, Cursor, and Codex."
keywords = ["mcp", "ai-agent", "code-search", "stdio", "claude"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "pluckd"
path = "src/main.rs"

[lib]
# Tool descriptions are include_str!'d markdown — they aren't Rust doctests.
doctest = false

[dependencies]
pluck-core = { path = "../pluck-core", version = "0.4.0" }
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-io"] }
schemars = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

[dev-dependencies]
tiktoken-rs.workspace = true

[[bench]]
name = "session_dedup"
harness = false
