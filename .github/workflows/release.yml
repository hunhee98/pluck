name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.2.0"
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify release gate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release metadata
        run: python3 scripts/version-check.py --tag "${RELEASE_TAG}"

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Prepare benchmark output directory
        run: mkdir -p benchmarks/results

      - name: Run tests
        run: cargo test --all

      - name: Run release regression gate
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/regression-gate.py 2>&1 | tee benchmarks/results/regression-gate.log

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-results-${{ github.run_id }}
          path: benchmarks/results/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # Cross-compile to aarch64 Linux needs a cross-linker plus target
      # OpenSSL. `hf-hub` uses native-tls in the sync downloader, so the
      # release builder must provide arm64 libssl to keep this target in
      # the artifact set.
      #
      # The Azure-hosted mirror (`azure.archive.ubuntu.com`) used by GH
      # runners does NOT publish arm64 package indexes; an
      # `--add-architecture arm64` + `apt-get install libssl-dev:arm64`
      # against the default sources fails with exit 100 because every
      # arm64 Packages fetch is `Ign`-ored. Restrict the default sources
      # to amd64, then add arm64 sources from `ports.ubuntu.com`
      # (Canonical's arm64 archive) before installing.
      - name: Install aarch64 cross-toolchain (Linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # Pin existing Ubuntu sources to amd64. Newer runners use the
          # deb822 .sources format; older ones still use the classic
          # one-line `deb` format. Handle both.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb |deb [arch=amd64] |' /etc/apt/sources.list
          fi

          # Add arm64 sources from ports.ubuntu.com — Canonical's arm64
          # archive, separate from the Azure-mirrored amd64 archive.
          codename=$(lsb_release -cs)
          sudo tee /etc/apt/sources.list.d/arm64.list <<EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $codename main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $codename-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $codename-security main restricted universe multiverse
          EOF

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # g++-aarch64-linux-gnu is needed for transitive C++ build
          # scripts (e.g. esaxx-rs via tokenizers); the C-only cross
          # gcc is not enough. Found by running v0.5.1's release
          # workflow with only gcc — esaxx-rs's cc-rs build failed
          # with `failed to find tool "aarch64-linux-gnu-g++"`.
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config \
            libssl-dev:arm64
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "AARCH64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR=/usr/include" >> "$GITHUB_ENV"

      - name: Build pluck + pluckd
        run: cargo build --release --target ${{ matrix.target }} --bins -p pluck-cli -p pluck-mcp

      - name: Package
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release \
              -czf dist/pluck-${{ matrix.target }}.tar.gz \
              pluck pluckd

      - uses: actions/upload-artifact@v6
        with:
          name: pluck-${{ matrix.target }}
          path: dist/

  github_release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/**/*.tar.gz
          generate_release_notes: true
