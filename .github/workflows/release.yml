name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13 # Intel runner
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # Cross-compile to aarch64 Linux needs a cross-linker on x86 hosts.
      - name: Install aarch64 cross-toolchain (Linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build pluck + pluckd
        run: cargo build --release --target ${{ matrix.target }} --bins -p pluck-cli -p pluck-mcp

      - name: Package
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release \
              -czf dist/pluck-${{ matrix.target }}.tar.gz \
              pluck pluckd

      - uses: actions/upload-artifact@v4
        with:
          name: pluck-${{ matrix.target }}
          path: dist/

  github_release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          generate_release_notes: true

  crates_io:
    name: publish crates.io
    needs: github_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish (ordered, with index-propagation sleeps)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p pluck-core
          # crates.io needs a moment to index the parent before dependents
          # can find it. 20s has been reliable for similar workspaces.
          sleep 20
          cargo publish -p pluck-mcp
          sleep 20
          cargo publish -p pluck-cli
