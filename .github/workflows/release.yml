name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify release gate
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Prepare benchmark output directory
        run: mkdir -p benchmarks/results

      - name: Run tests
        run: cargo test --all

      - name: Run release regression gate
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/regression-gate.py 2>&1 | tee benchmarks/results/regression-gate.log

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-gate-results-${{ github.run_id }}
          path: benchmarks/results/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-13 # Intel runner
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain from rust-toolchain.toml
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build pluck + pluckd
        run: cargo build --release --target ${{ matrix.target }} --bins -p pluck-cli -p pluck-mcp

      - name: Package
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release \
              -czf dist/pluck-${{ matrix.target }}.tar.gz \
              pluck pluckd

      - uses: actions/upload-artifact@v6
        with:
          name: pluck-${{ matrix.target }}
          path: dist/

  github_release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          generate_release_notes: true

  crates_io:
    name: publish crates.io
    needs: github_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Publish (ordered, with index-propagation sleeps)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p pluck-core
          # crates.io needs a moment to index the parent before dependents
          # can find it. 20s has been reliable for similar workspaces.
          sleep 20
          cargo publish -p pluck-mcp
          sleep 20
          cargo publish -p pluck-cli
