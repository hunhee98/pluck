name: Benchmark

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  # Phase 0 / Phase 1 benches — all deterministic, no API key needed.
  # Each runs `cargo bench` against one of the harnesses and uploads the
  # stdout as an artifact. The dashboard build (Phase 4) will diff these
  # against the previous run for regression-gating.
  bench:
    name: bench (${{ matrix.bench }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bench:
          - chunker     # AST chunker microbench (pluck-core)
          - tokens      # outline vs cat token savings (pluck-core)
          - search      # pluck.search vs grep+cat token savings (pluck-core)
          - indexer     # walk + index throughput + cold/warm search (pluck-core)
          - freshness   # save → search-visible latency (pluck-core)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install ripgrep (pluck.grep passthrough target)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run bench
        run: cargo bench -p pluck-core --bench ${{ matrix.bench }} | tee bench-${{ matrix.bench }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.bench }}
          path: bench-${{ matrix.bench }}.txt

  # Session-dedup bench lives in pluck-mcp.
  bench_session_dedup:
    name: bench (session_dedup)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p pluck-mcp --bench session_dedup | tee bench-session_dedup.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-session_dedup
          path: bench-session_dedup.txt

  # End-to-end deterministic scenario from pluck-bench.
  scenario:
    name: scenario (fix-auth-token-expiry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p pluck-bench --release -- run --scenario fix-auth-token-expiry --output benchmarks/results/
      - uses: actions/upload-artifact@v4
        with:
          name: scenario-fix-auth-token-expiry
          path: benchmarks/results/
