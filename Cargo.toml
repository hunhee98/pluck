[workspace]
members = [
  "crates/pluck-core",
  "crates/pluck-mcp",
  "crates/pluck-cli",
  "crates/pluck-bench",
]
resolver = "2"

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/hunhee98/pluck"
homepage = "https://github.com/hunhee98/pluck"
readme = "README.md"

[workspace.dependencies]
# AST / parsing
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-sequel = "0.3"
tree-sitter-hcl = "1.1"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-scss = "1.0"
tree-sitter-md-025 = "0.5.6"
tree-sitter-swift = "0.7.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"

# Search / index
tantivy = "0.26"
rusqlite = { version = "0.31", features = ["bundled"] }

# Semantic — potion-code-16M is a static (model2vec-style) embedder, not a
# transformer, so we don't need ONNX at runtime. Just the embedding matrix
# (safetensors), the HuggingFace tokenizer, and ndarray for the matmul.
tokenizers = "0.20"
safetensors = "0.4"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
ndarray = "0.15"
ort = "2.0.0-rc.12"  # reserved for Phase 4 LLM-driven runners; not wired into core today

# MCP
rmcp = "1.7"

# Runtime
tokio = { version = "1", features = ["full"] }

# Watcher
notify = "6.1"

# File walker (respects .gitignore)
ignore = "0.4"

# Home/config dir resolution
dirs = "5"

# Tokenization for measurement
tiktoken-rs = "0.5"

# Utils
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml_edit = "0.22"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
